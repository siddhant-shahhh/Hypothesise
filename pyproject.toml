[project]
name = "weaver"
version = "0.1.0"
description = "Agent Immune System — behavioural security layer for AI agents"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core", "packages/store", "packages/proxy", "packages/api"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
