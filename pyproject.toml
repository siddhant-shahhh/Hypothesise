[project]
name = "weaver"
version = "0.1.0"
description = "Agent Immune System — behavioural security layer for AI agents"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["packages/core", "packages/store", "packages/proxy", "packages/api"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
extend-exclude = ["._*", "**/._*"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]   # line length is formatting, not correctness

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]   # sys.path shim must precede imports

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
