# Workspace root. Not itself a distributable package — the shippable units are
# under packages/*. `pip install -e .` installs all of them (see [tool.uv.sources]
# and scripts/dev-setup.sh).
[project]
name = "weaver-workspace"
version = "0.1.0"
description = "Agent Immune System — behavioural security layer for AI agents"
requires-python = ">=3.10"
dependencies = [
    "weaver-core",
    "weaver-store",
    "weaver-proxy",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv.sources]
weaver-core = { workspace = true }
weaver-store = { workspace = true }
weaver-proxy = { workspace = true }
weaver-api = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["packages/core", "packages/store", "packages/proxy", "packages/api", "packages/adapters/langgraph"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
extend-exclude = ["._*", "**/._*"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]   # line length is formatting, not correctness

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]   # sys.path shim must precede imports
# Body()/Query() in argument defaults is FastAPI's documented idiom, and the
# thing B008 warns about (a shared mutable evaluated once) does not apply.
"packages/api/*" = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
