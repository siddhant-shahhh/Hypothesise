name: config_read_no_secret
description: Reading ordinary config files. CONFIG class, low floor, no egress after.
expect: silent
agent_id: coding-agent-prod
events:
  - {tool: {server: fs-mcp, name: read_file}, resource: "file:///app/config/logging.yaml"}
  - {tool: {server: fs-mcp, name: read_file}, resource: "file:///app/docker-compose.yml"}
  - {tool: {server: fs-mcp, name: write_file}, resource: "file:///app/config/logging.yaml"}
