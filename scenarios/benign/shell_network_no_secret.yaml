name: shell_network_no_secret
description: >
  Shell commands that reach the network for entirely ordinary reasons - package
  installs and internal health checks. shell_exfil requires BOTH network access
  AND a secret reference; either alone is daily work.
expect: silent
agent_id: deploy-agent-prod
events:
  - {tool: {server: shell-mcp, name: exec}, resource: "shell://pip install -r requirements.txt"}
  - {tool: {server: shell-mcp, name: exec}, resource: "shell://curl -s https://pypi.org/simple/requests/"}
  - {tool: {server: shell-mcp, name: exec}, resource: "shell://curl -s http://api.internal/health"}
  - {tool: {server: shell-mcp, name: exec}, resource: "shell://cat /app/.env"}
