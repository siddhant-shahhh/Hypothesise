name: ci_deploy_flow
description: >
  Deploy agent doing its normal job — config read, shell execution, container
  restart. Touches SHELL class (0.25 floor) repeatedly and legitimately.
expect: silent
agent_id: deploy-agent-prod
events:
  - {tool: {server: github-mcp, name: get_file_contents}, resource: "github://acme/api/docker-compose.yml"}
  - {tool: {server: shell-mcp,  name: exec},              resource: "shell://docker build -t api ."}
  - {tool: {server: shell-mcp,  name: exec},              resource: "shell://docker compose up -d"}
  - {tool: {server: http-mcp,   name: fetch},             resource: "http://api.internal/health"}
