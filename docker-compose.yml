# Control plane only. The proxy runs on the host, as a subprocess of your MCP
# client — see docs/DOGFOOD.md.
#
#   docker compose up -d          SQLite, data in a named volume
#   docker compose --profile postgres up -d
services:
  hypothesise-api:
    build: .
    image: hypothesise:0.1.0
    ports:
      - "127.0.0.1:8080:8080"   # localhost only: no auth yet (ADR-009)
    volumes:
      - hypothesise-data:/data
    environment:
      HYPOTHESISE_HOME: /data
      # HYPOTHESISE_WEBHOOK: https://your-relay.example.com/hook
    restart: unless-stopped

  # Optional Postgres. Untested against a real server (ADR-028) — the switch
  # works, the combination has not been verified.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hypothesise
      POSTGRES_USER: hypothesise
      POSTGRES_PASSWORD: change-me
    volumes:
      - hypothesise-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypothesise"]
      interval: 10s
      retries: 5

  hypothesise-api-postgres:
    profiles: ["postgres"]
    build: .
    image: hypothesise:0.1.0
    command: ["api", "--host", "0.0.0.0", "--port", "8080",
              "--db", "postgresql+psycopg://hypothesise:change-me@postgres:5432/hypothesise"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hypothesise-data:
  hypothesise-pg:
