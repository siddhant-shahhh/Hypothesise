[project]
name = "weaver-langgraph"
version = "0.1.0"
description = "Weaver LangGraph callback adapter (M4)"
requires-python = ">=3.10"
dependencies = ["weaver-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weaver_langgraph"]
