[project]
name = "hypothesise-store"
version = "0.1.0a3"
description = "Hypothesise persistence — SQLAlchemy Core, Postgres-portable"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypothesise_store"]
