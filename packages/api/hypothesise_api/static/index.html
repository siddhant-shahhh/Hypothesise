<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypothesise — Agent fleet dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>

<style>
/* ===== Hypothesise Design System ===== */
:root {
  --sans: 'Roboto', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --serif: 'GFS Didot', 'Didot', 'Bodoni MT', Georgia, serif;
}

[data-theme="light"] {
  --page: #EFEAE4;
  --chrome: #EDE8E3;
  --chrome-line: #D8CEBF;
  --main: #F7F4F0;
  --card: #FFFFFF;
  --card-line: #EDE8E3;
  --ink: #141210;
  --ink-2: #6f6558;
  --ink-3: #8a7f72;
  --accent: #5A4C3E;
  --accent-ink: #EDE8E3;
  --accent-soft: #756251;
  --url-bg: #FAF7F4;
  --track: #D8CEBF;
  --gauge: #756251;
  --bar: #EDE8E3;
  --bar-fill: #756251;
  --h0: #EDE8E3;
  --h1: #D8CEBF;
  --h2: #C4B29E;
  --h3: #756251;
  --h9: #5A4C3E;
  --hl: #141210;
  --ok: #5f9a58;
  --warn: #b98118;
  --danger: #9e3d36;
  --chip-ask-bg: #D8CEBF;
  --chip-ask-ink: #5A4C3E;
  --chip-block-bg: #756251;
  --chip-block-ink: #EDE8E3;
  --shadow: 0 1px 3px rgba(90,76,62,.05), 0 6px 18px rgba(90,76,62,.04);
}

[data-theme="dark"] {
  --page: #0b0a09;
  --chrome: #131110;
  --chrome-line: #26221e;
  --main: #0e0c0a;
  --card: #171512;
  --card-line: #26221e;
  --ink: #EDE8E3;
  --ink-2: #b3a899;
  --ink-3: #8a7f72;
  --accent: #C4B29E;
  --accent-ink: #14110e;
  --accent-soft: #a8957f;
  --url-bg: #0e0c0a;
  --track: #2e2924;
  --gauge: #C4B29E;
  --bar: #26221e;
  --bar-fill: #C4B29E;
  --h0: #26221e;
  --h1: #3a342d;
  --h2: #6b5d4e;
  --h3: #a8957f;
  --h9: #E3DACF;
  --hl: #EDE8E3;
  --ok: #8fb98a;
  --warn: #e0b04a;
  --danger: #cf665d;
  --chip-ask-bg: #3a342d;
  --chip-ask-ink: #E3DACF;
  --chip-block-bg: #C4B29E;
  --chip-block-ink: #14110e;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100vh; }
body {
  font-family: var(--sans);
  background: var(--page);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
}

button { font-family: inherit; }
a { color: var(--accent-soft); text-decoration: none; }
a:hover { color: var(--ink); }

/* Frame layout */
.frame { min-height: 100vh; display: flex; flex-direction: column; background: var(--main); }

/* Unified Header & Navigation Bar */
.header-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 22px;
  background: var(--chrome);
  border-bottom: 1px solid var(--chrome-line);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-wrap: wrap;
}

.header-bar .brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
}
.header-bar .brand small {
  font-weight: 400;
  font-size: .75rem;
  color: var(--ink-2);
  font-family: var(--sans);
  border-left: 1px solid var(--chrome-line);
  padding-left: 10px;
  display: inline-block;
}

/* Hypothesise Logo */
@keyframes pl {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.6; }
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
  text-decoration: none;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1;
}
.logo svg {
  width: 20px;
  height: 20px;
  flex: none;
}
.logo svg path.v-bar {
  stroke: var(--ink);
  transition: stroke 0.3s ease;
}
.logo svg path.h-dash {
  stroke: var(--h2);
  transition: stroke 0.3s ease;
}
[data-theme="light"] .logo svg path.h-dash {
  stroke: var(--h3);
}
.logo .pulse {
  transform-origin: 16px 16px;
  fill: var(--h2);
  animation: pl 3s ease-in-out infinite;
  transition: fill 0.3s ease;
}
[data-theme="light"] .logo .pulse {
  fill: var(--h3);
}
.logo b {
  color: var(--h2);
  font-weight: 400;
  font-style: italic;
  transition: color 0.3s ease;
}
[data-theme="light"] .logo b {
  color: var(--h3);
}

.nav-links {
  display: flex;
  gap: 4px;
  align-items: center;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-links::-webkit-scrollbar { display: none; }
.nav-links button {
  background: transparent;
  border: 1px solid transparent;
  color: var(--ink-2);
  padding: 6px 14px;
  border-radius: 99px;
  cursor: pointer;
  font: 500 .8rem var(--sans);
  white-space: nowrap;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nav-links button:hover {
  color: var(--ink);
  background: rgba(120, 100, 80, 0.1);
}
.nav-links button.on {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 1px 4px rgba(0,0,0,.15);
}

.theme-toggle {
  border: 1px solid var(--chrome-line);
  background: var(--url-bg);
  color: var(--ink-2);
  border-radius: 99px;
  padding: 5px 13px;
  font-size: .75rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
  flex: none;
  margin-left: auto;
}
.theme-toggle:hover { color: var(--ink); border-color: var(--accent-soft); }

#pcount {
  background: var(--warn);
  color: #141210;
  border-radius: 99px;
  padding: 1px 6px;
  font: 700 10px var(--mono);
}
#pcount:empty { display: none; }

/* Main Content Area */
main {
  padding: 24px 30px 60px;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}

/* Header & Breadcrumb */
.hdr {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.hdr small { display: block; color: var(--ink-3); font-size: .84rem; margin-bottom: 2px; }
.hdr h1 {
  margin: 0;
  font-size: clamp(1.4rem, 2vw + .6rem, 1.9rem);
  letter-spacing: -.02em;
  font-weight: 700;
  color: var(--ink);
}
.lede { color: var(--ink-2); font-size: .84rem; margin: 4px 0 0; }

.hr-stat {
  margin-left: auto;
  text-align: right;
}
.hr-stat small { display: block; color: var(--ink-3); font-size: .75rem; }
.hr-stat b { font-size: 1.3rem; letter-spacing: -.02em; color: var(--ink); }

/* Grids & Cards */
.g2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.g4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }

.cd {
  background: var(--card);
  border: 1px solid var(--card-line);
  border-radius: 14px;
  padding: 20px;
  min-width: 0;
  box-shadow: var(--shadow);
  transition: background .3s, border-color .3s;
  margin-bottom: 16px;
}
.g2 > .cd, .g3 > .cd { margin-bottom: 0; }

.ch {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  font-size: .92rem;
  font-weight: 600;
}
.ch .dim { font-size: .78rem; font-weight: 400; color: var(--ink-3); }

/* Heatmap & Numbers */
.nums { display: flex; gap: 26px; margin-bottom: 10px; flex-wrap: wrap; }
.nums b { display: block; font-size: 1.8rem; letter-spacing: -.03em; line-height: 1.1; font-weight: 700; }
.nums small { color: var(--ink-3); font-size: .76rem; }

.heat {
  display: grid;
  grid-template-rows: repeat(5, 1fr);
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 3px;
  margin-top: 14px;
}
.heat .hc {
  width: auto;
  height: auto;
  aspect-ratio: 1;
  border-radius: 3px;
  background: var(--h0);
  transition: transform .1s;
}
.heat .hc:hover { transform: scale(1.3); z-index: 2; }
.hc.l1 { background: var(--h1); }
.hc.l2 { background: var(--h2); }
.hc.l3 { background: var(--h3); }
.hc.l9 { background: var(--h9); }
.heat .hl { outline: 2px solid var(--hl); outline-offset: 1px; }

.lg {
  font-size: .72rem;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 400;
}
.lg .hc { width: 9px; height: 9px; border-radius: 2px; }

/* Gauge meter */
.gz { width: 100%; max-width: 220px; display: block; margin: 0 auto; }
.gl { text-align: center; font-size: .84rem; color: var(--ink-2); margin-bottom: 8px; font-weight: 600; }

.kv div {
  display: flex;
  justify-content: space-between;
  font-size: .8rem;
  padding: 6px 0;
  border-top: 1px solid var(--card-line);
}
.kv span { color: var(--ink-2); }
.kv b { font-weight: 600; font-family: var(--mono); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th {
  text-align: left;
  color: var(--ink-3);
  font-weight: 500;
  font-size: .72rem;
  padding: 8px 10px;
  border-bottom: 1px solid var(--card-line);
  white-space: nowrap;
}
td {
  padding: 10px 10px;
  border-bottom: 1px solid var(--card-line);
  vertical-align: top;
}
tr:last-child td { border-bottom: none; }
tr.click { cursor: pointer; transition: background .15s; }
tr.click:hover { background: rgba(120, 100, 80, 0.05); }

/* Typography Helpers & Badges */
.mono { font-family: var(--mono); word-break: break-all; }
.dim { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: .74rem; }

.v { font-weight: 600; font-size: .72rem; letter-spacing: .4px; font-family: var(--mono); }
.v.allow { color: var(--ok); }
.v.ask { color: var(--warn); }
.v.block { color: var(--danger); }

.pill {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 99px;
  font-size: .68rem;
  border: 1px solid var(--card-line);
  color: var(--ink-2);
  white-space: nowrap;
  font-family: var(--mono);
}
.pill.secret { color: var(--danger); border-color: currentColor; }
.pill.shell, .pill.network_egress { color: var(--warn); border-color: currentColor; }
.pill.database { color: var(--accent-soft); border-color: currentColor; }

.bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: 5px; max-width: 140px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--bar-fill); }

.tmeter { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: 5px; max-width: 150px; }
.tmeter i { display: block; height: 100%; border-radius: 3px; }

.btn {
  border: 1px solid var(--card-line);
  background: var(--chrome);
  color: var(--ink);
  padding: 5px 14px;
  border-radius: 99px;
  cursor: pointer;
  font: 500 .75rem var(--sans);
  transition: all .15s;
}
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ok { color: var(--ok); border-color: var(--ok); }
.btn.no { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.det { color: var(--accent-soft); font-size: .75rem; margin-top: 3px; font-family: var(--mono); }
.sentence {
  color: var(--ink);
  font-size: .78rem;
  margin-top: 5px;
  padding: 6px 10px;
  border-left: 2px solid var(--chrome-line);
  background: var(--main);
  border-radius: 0 6px 6px 0;
  font-family: var(--sans);
}
.sentence.block { border-left-color: var(--danger); }
.sentence.ask { border-left-color: var(--warn); }

.note {
  border-left: 3px solid var(--warn);
  padding: 10px 14px;
  background: var(--main);
  border-radius: 0 8px 8px 0;
  font-size: .78rem;
  color: var(--ink-2);
  margin-top: 14px;
  line-height: 1.45;
}
.note b { color: var(--ink); font-weight: 500; }
.note.hard { border-left-color: var(--danger); }

.ev {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  font: 400 .7rem var(--mono);
  background: var(--chrome);
  border: 1px solid var(--chrome-line);
  color: var(--ink-2);
  margin: 2px 3px 2px 0;
}

.zone {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 99px;
  font: 600 .68rem var(--sans);
  letter-spacing: .3px;
  border: 1px solid currentColor;
}
.zone.cold { color: var(--ok); }
.zone.warm { color: var(--warn); }
.zone.hot { color: var(--danger); }
.quar { color: var(--danger); font: 700 .7rem var(--sans); letter-spacing: .4px; margin-top: 3px; }

.tg {
  display: inline-block;
  width: 32px;
  height: 18px;
  border-radius: 9px;
  background: var(--chrome-line);
  position: relative;
  flex: none;
}
.tg:after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: left .15s;
}
.tg.on { background: var(--accent); }
.tg.on:after { left: 16px; }

.srch {
  background: var(--url-bg);
  border: 1px solid var(--chrome-line);
  color: var(--ink);
  border-radius: 99px;
  padding: 7px 16px;
  font: .8rem var(--sans);
  min-width: 240px;
}

.tb { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.empty { color: var(--ink-3); text-align: center; padding: 36px 20px; font-size: .84rem; }
.empty code { background: var(--chrome); padding: 2px 6px; border-radius: 4px; color: var(--ink); font-family: var(--mono); }
#cy { height: 500px; background: var(--main); border-radius: 12px; border: 1px solid var(--card-line); }

.trend { font-family: var(--mono); font-size: .78rem; }
.trend.rising { color: var(--danger); }
.trend.decaying { color: var(--ok); }
.trend.stable { color: var(--ink-3); }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: .75rem; color: var(--ink-3); margin-top: 10px; }
.key i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.key i.dash { width: 16px; height: 0; border-top: 2px dashed var(--danger); border-radius: 0; margin-bottom: 3px; }

.list > div {
  padding: 10px 0;
  border-top: 1px solid var(--card-line);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}
.list > div:first-child { border-top: 0; }
.big { font: 700 2.2rem var(--sans); line-height: 1.1; letter-spacing: -.03em; }
.row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: .78rem; color: var(--ink-2); padding: 5px 0; }
.row span:last-child { color: var(--ink); text-align: right; }

/* Decision pills / Chips from reference */
.dc {
  flex: none;
  min-width: 50px;
  text-align: center;
  font-size: .64rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--bar);
  color: var(--ink);
  letter-spacing: .03em;
  font-family: var(--mono);
}
.dc.ask { background: var(--chip-ask-bg); color: var(--chip-ask-ink); }
.dc.block { background: var(--chip-block-bg); color: var(--chip-block-ink); }
.dc.allow { background: var(--bar); color: var(--ok); }

.fd { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--card-line); font-size: .82rem; }
.fd:first-child { border-top: none; }
.fd small { display: block; color: var(--ink-3); font-size: .72rem; margin-top: 2px; line-height: 1.4; }

/* Resource signals list (reference design item) */
.sr { display: grid; grid-template-columns: 1.5fr 1fr 34px; gap: 10px; align-items: center; font-size: .78rem; padding: 7px 0; }
.sr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
.sr b { text-align: right; font-family: var(--mono); }

/* Responsive adjustments */
@media (max-width: 1000px) {
  .g2, .g3 { grid-template-columns: 1fr; }
  main { padding: 16px; }
}
@media (max-width: 768px) {
  .header-bar { padding: 8px 12px; gap: 10px; }
  .nav-links button { padding: 5px 10px; font-size: .75rem; }
  .nums { gap: 14px; }
  .nums b { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="frame">
  <!-- Unified Header & Navigation Bar -->
  <header class="header-bar">
    <div class="brand">
      <div class="logo">
        <svg aria-hidden="true" fill="none" stroke-linecap="round" viewBox="0 0 32 32">
          <path class="v-bar" d="M9 6v20M23 6v20" stroke-width="2.2"></path>
          <path class="h-dash" d="M11.5 16h9" stroke-dasharray="1.5 3" stroke-width="1.6"></path>
          <circle class="pulse" cx="16" cy="16" r="3"></circle>
        </svg>
        <span>hypothe<b>si</b>se</span>
      </div>
      <small>agent fleet immune system</small>
    </div>
    <nav class="nav-links" id="navbar" aria-label="Dashboard views">
      <button data-v="overview" class="on">Overview</button>
      <button data-v="sessions">Sessions</button>
      <button data-v="agents">Agents</button>
      <button data-v="graph">Behavioural web</button>
      <button data-v="trust">Trust zones</button>
      <button data-v="signals">Threat signals</button>
      <button data-v="alerts">Alerts</button>
      <button data-v="approvals">Approvals <span id="pcount"></span></button>
      <button data-v="shadow">Shadow</button>
      <button data-v="policies">Policies</button>
      <button data-v="audit">Audit log</button>
      <button data-v="settings">Settings</button>
    </nav>
    <button class="theme-toggle" id="themeBtn" type="button"><span id="themeIco">☾</span> <span id="themeTxt">Dark</span></button>
  </header>

  <!-- App Main Mount -->
  <main id="app"><div class="empty">loading dashboard…</div></main>
</div>

<script>
// ==========================================
// Hypothesise Client Architecture & Mock Data
// ==========================================

const $ = s => document.querySelector(s);
const app = $('#app');
let view = 'overview', session = null, picked = 'coding-agent', query = '';

// Helpers
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = u => { const s = String(u ?? ''); return s.length > 55 ? s.slice(0,52)+'…' : s; };
const when = t => esc(String(t ?? '').replace('T',' ').slice(0,19));
const num = n => (n ?? 0).toLocaleString();
const vClass = v => `v ${v}`;
const zc = z => z === 'hot' ? 'var(--danger)' : z === 'warm' ? 'var(--warn)' : 'var(--ok)';
const ZONE = {cold:'Safe', warm:'Caution', hot:'Restricted'};
const head = (t, d) => `<header class="hdr"><div><small>Hypothesise / ${esc(view)}</small><h1>${t}</h1></div><p class="lede">${d}</p></header>`;
const evs = l => (l||[]).map(d => `<span class="ev">${esc(d.detector)}${d.weight!=null?' '+Number(d.weight).toFixed(2):''}</span>`).join('');

// Rich Dummy/Mock Data for full standalone fidelity & offline design review
const MOCK = {
  stats: {
    events: 23631,
    sessions: 42,
    agents: 7,
    verdicts: { allow: 23613, ask: 6, block: 12 },
    latency_ms: { mean: 0.14, max: 8.4, near_budget: 0, failed_open: 0 },
    detectors: [
      { detector: 'novel_sequence', count: 18 },
      { detector: 'novel_edge', count: 8 },
      { detector: 'path_risk', count: 6 },
      { detector: 'fan_out', count: 4 },
      { detector: 'shell_exfil', count: 3 },
      { detector: 'sensitive_then_egress', count: 2 },
      { detector: 'scope_widening', count: 2 },
      { detector: 'retry_after_denial', count: 1 },
      { detector: 'argument_anomaly', count: 1 }

// Sample data is for design review ONLY: open the page with ?demo to see it.
// A security dashboard must never show invented alerts when the real API is
// down — a broken install would look healthy. Without ?demo, a failed request
// is an error on screen, which is the truth.
const DEMO = new URLSearchParams(location.search).has('demo');

async function api(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error('Status ' + res.status);
    return await res.json();
  } catch (err) {
    if (DEMO) return resolveMock(path);
    throw new Error(`cannot reach the Hypothesise API (${path}): ${err.message}. Is \`hypothesise api\` running?`);
  }
}

function resolveMock(path) {
  const p = path.split('?')[0];
  if (p === '/v1/stats') return MOCK.stats;
  if (p === '/v1/sessions') return MOCK.sessions;
  if (p.startsWith('/v1/sessions/')) return MOCK.timeline;
  if (p === '/v1/agents') return MOCK.agents;
  if (p.includes('/behavior')) return MOCK.behavior;
  if (p === '/v1/graph') return MOCK.graph;
  if (p === '/v1/policy') return MOCK.policy;
  if (p === '/v1/signals') return MOCK.signals;
  if (p === '/v1/alerts') return MOCK.alerts;
  if (p === '/v1/approvals') return MOCK.approvals;
  if (p === '/v1/shadow') return MOCK.shadow;
  if (p === '/v1/decisions') return MOCK.decisions;
  if (p === '/healthz') return { version: '0.9.4', ok: true };
  if (p === '/readyz') return { ok: true, schema: { current: 1 } };
  return {};
}

function wireAgentButtons() {

// 4. BEHAVIOURAL WEB (Interactive Cytoscape)
// ==========================================
async function graph() {
  const g = await api('/v1/graph');
  if (!g.nodes || !g.nodes.length) { app.innerHTML = head('Behavioural web','Agents, tools and resources') + emptyHint(); return; }
  const SENS = ['secret','shell','network_egress'];
  const byId = Object.fromEntries(g.nodes.map(n => [n.id, n]));
  const danger = e => { const d = byId[e.dst]; return !!d && SENS.includes(d.class) && d.risk > (d.risk_floor ?? 0) + 1e-6; };
  const hot = g.nodes.filter(n => SENS.includes(n.class)).sort((a,b) => b.risk - a.risk).slice(0, 8);

  app.innerHTML = head('Behavioural web','Risk lives on nodes and edges — never on a static table') + `
  <div class="g2">
    <section class="cd">
      <div class="ch"><b>Ecosystem graph</b><span class="dim">${g.nodes.length} nodes · ${g.edges.length} edges</span></div>
      <div id="cy"></div>
      <div class="key">
        <span><i style="background:var(--ok)"></i>Low risk</span>
        <span><i style="background:var(--warn)"></i>Elevated</span>
        <span><i style="background:var(--danger)"></i>High risk</span>
        <span><i style="background:var(--accent)"></i>Agent</span>
        <span><i class="dash"></i>Reinforced sensitive edge</span>
      </div>
    </section>
    <section class="cd" id="side">
      <div class="ch"><b>Dangerous paths</b><span class="dim">reinforced targets</span></div>
      ${hot.length ? hot.map(n => `
        <div style="margin-bottom:12px">
          <div class="mono" style="font-size:12px"><b>${esc(short(n.label||n.id))}</b></div>
          <div>
            <span class="pill ${esc(n.class)}">${esc(n.class)}</span>
            <span class="dim" style="font-family:var(--mono);font-size:11px"> risk ${n.risk.toFixed(3)} · floor ${(n.risk_floor??0).toFixed(2)} · seen ${n.observations||1}×</span>
          </div>
          <div class="bar" style="max-width:none"><i style="width:${n.risk*100}%"></i></div>
        </div>`).join('') : '<div class="empty">No sensitive resources reached</div>'}
      <div class="note">Click an agent node in the graph to view its reached paths and apply quarantine.</div>
    </section>
  </div>`;

  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const risky = r => r > .5 ? css('--danger') : r > .25 ? css('--warn') : css('--ok');

  const cy = cytoscape({
    container: $('#cy'),
    elements: [
      ...g.nodes.map(n => ({ data: { id: n.id, label: n.label?.slice(0,24)||n.id, kind: n.kind, risk: n.risk } })),
      ...g.edges.filter(e => byId[e.src] && byId[e.dst]).map(e => ({ data: { id: e.id, source: e.src, target: e.dst, w: Math.min(6, 1+e.count/4), bad: danger(e)?1:0 } }))
    ],
    style: [
      { selector: 'node', style: {
        'label': 'data(label)', 'font-size': 9, 'font-family': 'Roboto, sans-serif', 'color': css('--ink-2'),
        'text-valign': 'bottom', 'text-margin-y': 4,
        'background-color': e => e.data('kind') === 'agent' ? css('--accent') : risky(e.data('risk')),
        'width': e => e.data('kind') === 'agent' ? 24 : 16,
        'height': e => e.data('kind') === 'agent' ? 24 : 16,
        'shape': e => e.data('kind') === 'agent' ? 'round-rectangle' : 'ellipse'
      }},
      { selector: 'edge', style: {
        'width': 'data(w)', 'line-color': css('--chrome-line'),
        'target-arrow-color': css('--chrome-line'), 'target-arrow-shape': 'triangle',
        'curve-style': 'bezier', 'arrow-scale': .7
      }},
      { selector: 'edge[bad = 1]', style: {
        'line-color': css('--danger'), 'target-arrow-color': css('--danger'),
        'line-style': 'dashed', 'width': 2.5
      }}
    ],
    layout: { name: 'cose', animate: false, nodeRepulsion: 9000, idealEdgeLength: 70 }
  });

  cy.on('tap', 'node', ev => {
    const n = byId[ev.target.id()];
    if (n && n.kind === 'agent') {
      picked = n.label || n.id.replace(/^agent:/,'');
      agentSide();
    }
  });
}

  app.querySelectorAll('button[data-a]').forEach(b => {
    b.onclick = async () => {
      const cardEl = b.closest('[data-id]');
      cardEl.querySelectorAll('button').forEach(x => x.disabled = true);
      const approve = b.dataset.a === '1';
      await fetch(`/v1/approvals/${encodeURIComponent(cardEl.dataset.id)}/decide`, {

function tickTTL() {
  document.querySelectorAll('.ttl[data-exp]').forEach(el => {
    const left = Math.max(0, Math.round((new Date(el.dataset.exp) - Date.now()) / 1000));
    el.textContent = left ? `${left}s left` : 'expiring…';
    el.style.color = left < 15 ? 'var(--danger)' : 'var(--warn)';
  });
}
setInterval(() => { if (view === 'approvals') tickTTL(); }, 1000);

    </section>
  </div>`;
}

// ==========================================
// 11. AUDIT LOG
// ==========================================
async function audit() {
  const d = await api('/v1/decisions?limit=250' + (query ? '&q=' + encodeURIComponent(query) : ''));
  app.innerHTML = head('Audit log','Every single decision, allows included — full compliance trace') + `
  <section class="cd">
    <div class="ch"><b>Decision records</b><span class="dim">${d.length} results</span></div>
    <div class="tb"><input class="srch" id="q" placeholder="Filter by agent, tool, resource, or sentence" value="${esc(query)}"></div>
    ${d.length ? `<table><thead><tr><th>Timestamp</th><th>Agent</th><th>Tool & Action</th><th>Resource</th><th>Risk Score</th><th>Decision</th><th>Sentence</th></tr></thead>
    <tbody>${d.map(x => `<tr>
      <td class="dim" style="white-space:nowrap">${when(x.ts)}</td>
      <td><b>${esc(x.agent_id)}</b><div class="faint">step ${x.step ?? 1}</div></td>
      <td class="mono">${esc(x.tool)}<div class="faint">${esc(x.action || '')}</div></td>
      <td class="mono">${esc(short(x.resource)) || '<span class="faint">—</span>'}<div><span class="pill ${esc(x.class)}">${esc(x.class)}</span></div></td>
      <td>${(x.score||0).toFixed(2)}<div class="bar" style="max-width:60px"><i style="width:${(x.score||0)*100}%"></i></div></td>
      <td><span class="${vClass(x.verdict)}">${esc((x.verdict||'allow').toUpperCase())}</span></td>
      <td>${x.sentence ? esc(x.sentence) : '<span class="faint">matched baseline</span>'}</td>
    </tr>`).join('')}</tbody></table>` : '<div class="empty">No matching audit records found</div>'}
  </section>`;

  $('#q').oninput = e => {
    query = e.target.value;
    clearTimeout(window._qt);
    window._qt = setTimeout(audit, 250);
  };
}

function emptyHint() {
  return `<div class="card"><div class="empty">
    <p><b>No data registered yet.</b></p>
    <p class="dim">Run with demo telemetry:<br><code>hypothesise api --demo</code></p>
  </div></div>`;
}

// ==========================================
// Router & State Rendering
// ==========================================
const views = { overview, sessions, agents, graph, trust, signals, alerts, approvals, shadow, policies, audit, settings };

function render() {
  app.innerHTML = '<div class="empty">loading view…</div>';
  const loader = views[view] || overview;
  loader().catch(err => {
    app.innerHTML = `<section class="cd"><div class="empty">Error rendering ${esc(view)}: ${esc(err.message)}</div></section>`;
  });
}

// Navigation Wiring
document.querySelectorAll('.nav-links button[data-v]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav-links button[data-v]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    view = btn.dataset.v;
    session = null;
    query = '';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
});

// Theme Toggle Wiring
const rootEl = document.documentElement;
function setTheme(t) {
  rootEl.setAttribute('data-theme', t);
  $('#themeIco').textContent = t === 'light' ? '☾' : '☀';
  $('#themeTxt').textContent = t === 'light' ? 'Dark' : 'Light';
  try { localStorage.setItem('hyp-theme', t); } catch (e) {}
}
$('#themeBtn').onclick = () => {
  const next = rootEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  setTheme(next);
  if (view === 'graph') render();
};
try {
  const savedTheme = localStorage.getItem('hyp-theme');
  if (savedTheme) setTheme(savedTheme);
} catch (e) {}

// Approvals Count Badge Poller
async function refreshCount() {
  try {
    const a = await api('/v1/approvals');
    const el = $('#pcount');
    if (el) el.textContent = a.length ? a.length : '';
  } catch (e) {}
}
setInterval(refreshCount, 5000);

// Auto-refresh the current view every 5s. Re-runs the view loader in place —
// never render(), which nulls `session` and would eject a reader from a
// timeline. Skips views a refresh would break mid-interaction.
let liveHalt = false;
document.addEventListener('visibilitychange', () => { liveHalt = document.hidden; });
async function liveRefresh(){
  // An open timeline refreshes too: sessions() re-renders it in place, so the
  // reader stays put and new steps from a live agent appear as they happen.
  if (liveHalt || view === 'approvals' || view === 'graph') return;
  try { await views[view](); } catch (e) {}
}
setInterval(liveRefresh, 5000);

// Initial Load
render();
refreshCount();
</script>
