[project]
name = "hypothesise-api"
version = "0.1.0a1"
description = "Hypothesise control plane and dashboard"
requires-python = ">=3.10"
dependencies = ["hypothesise-core[scenarios]", "hypothesise-store", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
hypothesise-api = "hypothesise_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypothesise_api"]

[tool.hatch.build.targets.wheel.force-include]
"hypothesise_api/static" = "hypothesise_api/static"
