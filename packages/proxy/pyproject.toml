[project]
name = "weaver-proxy"
version = "0.1.0"
description = "Weaver MCP interception layer — the data plane"
requires-python = ">=3.10"
dependencies = ["weaver-core", "weaver-store"]

[project.scripts]
weaver-proxy = "weaver_proxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weaver_proxy"]
