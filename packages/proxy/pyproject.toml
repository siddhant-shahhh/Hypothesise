[project]
name = "hypothesise-proxy"
version = "0.1.0a3"
description = "Hypothesise MCP interception layer — the data plane"
requires-python = ">=3.10"
dependencies = ["hypothesise-core", "hypothesise-store"]

[project.scripts]
hypothesise-proxy = "hypothesise_proxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypothesise_proxy"]
