[project]
# Internal distribution name, never published. Only the root pyproject ships,
# as `hypothesise` (ADR-034).
name = "hypothesise-cli"
version = "0.1.0a4"
description = "The hypothesise command — api, proxy, doctor, migrate"
requires-python = ">=3.10"
dependencies = ["hypothesise-core", "hypothesise-store", "hypothesise-proxy", "hypothesise-api"]

[project.scripts]
hypothesise = "hypothesise.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypothesise"]
