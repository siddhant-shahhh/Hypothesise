[project]
# Internal distribution name. The PUBLIC name is unresolved — `weaver` is taken
# on PyPI (ADR-030) — and only the root pyproject's [project] name ships.
name = "weaver-cli"
version = "0.1.0"
description = "The weaver command — api, proxy, doctor, migrate"
requires-python = ">=3.10"
dependencies = ["weaver-core", "weaver-store", "weaver-proxy", "weaver-api"]

[project.scripts]
weaver = "weaver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weaver"]
